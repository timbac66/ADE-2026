<style>
  :root {
    --bg-color: #0b0e14;
    --card-bg: #161b22;
    --accent-yellow: #ffcc00;
    --accent-orange: #ff5500;
    --text-color: #f0f6fc;
    --text-muted: #8b949e;
    --border-color: #30363d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 0;
    margin: 0;
  }

  /* ADE Banner Style */
  .banner {
    background: linear-gradient(135deg, #000000 0%, #1a1a00 50%, #ffcc00 200%);
    border-bottom: 2px solid var(--accent-yellow);
    padding: 25px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
  }
  .banner-brand {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .ade-logo {
    background-color: var(--accent-yellow);
    color: #000;
    font-weight: 900;
    font-size: 1.8rem;
    padding: 10px 14px;
    clip-path: polygon(0 0, 100% 0, 100% 80%, 80% 100%, 0 100%);
    letter-spacing: -1px;
    display: inline-block;
  }
  .banner-titles h1 {
    font-size: 1.8rem;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .banner-titles h1 span { color: var(--accent-yellow); }
  .banner-titles p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  .filter-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .filter-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent-yellow);
    border-color: var(--accent-yellow);
    color: #000;
  }

  /* Map Container */
  #map-section {
    position: relative;
    margin-bottom: 25px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  #map {
    height: 400px;
    width: 100%;
    background: #111;
  }

  /* Map Theme Toggle Button */
  .map-theme-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: all 0.2s;
  }
  .map-theme-toggle:hover {
    background: var(--accent-yellow);
    color: #000;
    border-color: var(--accent-yellow);
  }

  /* Grid Layout */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .card:hover {
    border-color: var(--accent-yellow);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .date-badge {
    background: rgba(255, 204, 0, 0.15);
    color: var(--accent-yellow);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: bold;
  }
  .time-badge {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .event-title {
    font-size: 1.15rem;
    font-weight: bold;
    margin-bottom: 8px;
    color: #fff;
  }
  .venue {
    font-size: 0.9rem;
    color: var(--accent-yellow);
    margin-bottom: 12px;
    cursor: pointer;
  }
  .venue:hover {
    text-decoration: underline;
  }
  .lineup {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.4;
    margin-bottom: 20px;
    flex-grow: 1;
  }
  .card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
  }
  .vote-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .vote-btn.voted {
    background: rgba(255, 204, 0, 0.2);
    border-color: var(--accent-yellow);
    color: var(--accent-yellow);
  }
  .links a {
    color: var(--accent-yellow);
    text-decoration: none;
    font-size: 0.85rem;
    margin-left: 8px;
  }
  .links a:hover { text-decoration: underline; }

  /* Leaflet popup dark theme customization */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: #161b22 !important;
    color: #fff !important;
    border: 1px solid var(--border-color);
  }
  .leaflet-popup-content strong { color: var(--accent-yellow); }
</style>
</head>

];

let votes = {};
let map, markersLayer, currentTileLayer;
let currentFilterDate = 'all';
let currentTheme = 'dark';

// Tile URLs
const tileUrls = {
  dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
};

// Initialize Map
function initMap() {
  map = L.map('map').setView([52.3676, 4.9041], 12);
  
  currentTileLayer = L.tileLayer(tileUrls.dark, {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  updateMapMarkers('all');
}

function toggleMapTheme() {
  const btn = document.getElementById('themeToggleBtn');
  
  if (currentTheme === 'dark') {
    currentTheme = 'light';
    btn.innerHTML = '🌙 Dark Mode';
    map.removeLayer(currentTileLayer);
    currentTileLayer = L.tileLayer(tileUrls.light, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
  } else {
    currentTheme = 'dark';
    btn.innerHTML = '☀️ Light Mode';
    map.removeLayer(currentTileLayer);
    currentTileLayer = L.tileLayer(tileUrls.dark, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
  }
}

function extractDateOnly(datetimeStr) {
  if (!datetimeStr) return '';
  return datetimeStr.split(' ')[0];
}

function updateMapMarkers(filter) {
  markersLayer.clearLayers();
  
  const addedVenues = new Set();
  const bounds = [];

  events.forEach((item) => {
    const itemDate = extractDateOnly(item.Datum);
    if (filter !== 'all' && itemDate !== filter) return;
    
    const lat = parseFloat(item.lat);
    const lng = parseFloat(item.lng);
    const key = item.Venue + '_' + itemDate;

    if (!isNaN(lat) && !isNaN(lng) && !addedVenues.has(key)) {
      addedVenues.add(key);
      bounds.push([lat, lng]);

      const marker = L.circleMarker([lat, lng], {
        radius: 7,
        fillColor: "#ffcc00",
        color: "#ffcc00",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8
      });

      marker.bindPopup(`
        <div style="font-size:0.9rem;">
          <strong>📍 ${item.Venue}</strong><br/>
          <span style="color:#aaa;">${item.Event}</span><br/>
          <small>🕒 ${item.Tid || 'Tid saknas'} (${itemDate})</small>
        </div>
      `);
      markersLayer.addLayer(marker);
    }
  });

  // Adjust map bounds based on visible markers
  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  }
}

function renderEvents(filter = 'all') {
  currentFilterDate = filter;
  const grid = document.getElementById('eventsGrid');
  grid.innerHTML = '';
  
  events.forEach((item, index) => {
    const itemDate = extractDateOnly(item.Datum);
    if (filter !== 'all' && itemDate !== filter) return;
    
    const count = votes[index] || 0;
    const isVoted = votes[index + '_voted'];
    
    let linksHtml = '';
    if (item['ADE-länk']) linksHtml += `<a href="${item['ADE-länk']}" target="_blank">ADE</a>`;
    if (item['RA-länk']) linksHtml += `<a href="${item['RA-länk']}" target="_blank">RA</a>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>
        <div class="card-header">
          <span class="date-badge">${itemDate}</span>
          <span class="time-badge">${item.Tid || 'Tid saknas'}</span>
        </div>
        <div class="event-title">${item.Event}</div>
        <div class="venue" onclick="focusOnMap(${item.lat}, ${item.lng})">📍 ${item.Venue}</div>
        <div class="lineup"><strong>Lineup:</strong> ${item.Lineup || 'Ej publicerat'}</div>
      </div>
      <div class="card-actions">
        <button class="vote-btn ${isVoted ? 'voted' : ''}" onclick="toggleVote(${index})">
          🔥 <span>${count}</span>
        </button>
        <div class="links">${linksHtml}</div>
      </div>
    `;
    grid.appendChild(card);
  });

  updateMapMarkers(filter);
}

function focusOnMap(lat, lng) {
  if (map && lat && lng) {
    map.setView([parseFloat(lat), parseFloat(lng)], 15, { animate: true });
    window.scrollTo({ top: document.getElementById('map-section').offsetTop - 20, behavior: 'smooth' });
  }
}

function toggleVote(index) {
  if (!votes[index]) votes[index] = 0;
  if (votes[index + '_voted']) {
    votes[index]--;
    votes[index + '_voted'] = false;
  } else {
    votes[index]++;
    votes[index + '_voted'] = true;
  }
  renderEvents(currentFilterDate);
}

function filterDate(date, event) {
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  if (event && event.target) {
    event.target.classList.add('active');
  }
  renderEvents(date);
}

window.onload = function() {
  initMap();
  renderEvents('all');
};
</script>
